actions:
  apisYmlUpdated: true
  reason: |
    Identity-only bootstrap. apis[] left empty because no first-party public API
    or documented data-access API exists. common[] carries only verified links
    (Website, LinkedIn, X). No spec harvested. Record classified as aggregator-only
    open-finance posture, honestly reflecting the Canadian credit-union reality.
